# Bluetooth
#
# EXPERIMENTAL_FEATURES turns on two things:
#  - CONN: disables the 2M PHY, which some host chipsets (Windows Intel/Realtek,
#    older Intel Macs) refuse to pair/connect with.
#  - SEC: lets a host that was paired before pair again (overwrites its old
#    keys). Without this a stale pairing on the host side fails silently.
CONFIG_ZMK_BLE_EXPERIMENTAL_FEATURES=y
# SEC also pulls in passkey entry (you must type a 6-digit PIN on the keyboard
# to pair). Turn that off: plain "just works" pairing, no PIN.
CONFIG_ZMK_BLE_PASSKEY_ENTRY=n

# Max radio power. Battery cost is negligible, range/stability gain is real.
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# Works around a Windows bug with battery notifications.
CONFIG_BT_GATT_ENFORCE_SUBSCRIPTION=n

# Battery level shown in the host's Bluetooth settings.
CONFIG_ZMK_BATTERY_REPORTING=y

# Distinct name so this board can be told apart from the other Equals 60 in
# the host's Bluetooth list. Max 16 characters. Changing it only takes effect
# after flashing the settings_reset firmware once.
CONFIG_ZMK_KEYBOARD_NAME="eq60"

# Firmware-chosen Bluetooth address (see src/bt_identity.c). Bump the seed
# to make every previously paired computer see a brand-new keyboard.
# Takes effect after flashing the settings_reset firmware once.
CONFIG_EQ60_BT_IDENTITY=y
CONFIG_EQ60_BT_IDENTITY_SEED=1

# Deep sleep after 15 minutes idle. Any keypress wakes it; the first key
# after waking takes about a second to reconnect.
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000
